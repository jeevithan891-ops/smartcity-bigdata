services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in traffic health env city_metrics; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 2 --replication-factor 1
        done

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports: ["9870:9870"]
    environment:
      CLUSTER_NAME: smartcity
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes: [namenode:/hadoop/dfs/name]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on: [namenode]
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      SERVICE_PRECONDITION: "namenode:9870"
    volumes: [datanode:/hadoop/dfs/data]

  spark-stream:
    image: apache/spark:3.5.1
    container_name: spark-stream
    user: root
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      datanode: {condition: service_started}
    restart: on-failure
    environment: {HADOOP_USER_NAME: root}
    volumes: ["./app:/app"]
    ports: ["4040:4040"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[2]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - /app/stream_job.py

  spark-batch:
    image: apache/spark:3.5.1
    user: root
    profiles: ["batch"]
    environment: {HADOOP_USER_NAME: root}
    volumes: ["./app:/app"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["--master", "local[2]", "--conf", "spark.jars.ivy=/tmp/ivy", "/app/batch_analytics.py"]

  producer:
    build: ./app
    container_name: producer
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment: {KAFKA_BOOTSTRAP: "kafka:9092"}
    command: ["python", "producer.py"]
    restart: on-failure

  dashboard:
    build: ./app
    container_name: dashboard
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment: {KAFKA_BOOTSTRAP: "kafka:9092"}
    ports: ["8501:8501"]
    command: ["streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: on-failure

volumes:
  namenode:
  datanode:
